services:
  - type: web
    name: nanou-browser
    runtime: docker
    plan: free
    region: oregon
    branch: feat/cloud-browser-agent-mcp
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    # Keep the live preview aligned with this Blueprint and require deliberate deploys.
    autoDeployTrigger: off
    envVars:
      - key: NANOU_AGENT_API_KEY
        generateValue: true
      - key: NANOU_LLM_API_KEY
        sync: false
      - key: NANOU_LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: NANOU_LLM_MODEL
        value: openrouter/free
      - key: NANOU_MAX_CONCURRENT_RUNS
        value: "1"
      - key: NANOU_MAX_SESSIONS
        value: "1"

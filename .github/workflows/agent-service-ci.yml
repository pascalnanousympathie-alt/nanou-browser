name: Nanou Browser Agent Service CI

on:
  push:
    branches:
      - feat/cloud-browser-agent-mcp
    paths:
      - "agent-service/**"
      - "Dockerfile"
      - ".github/workflows/agent-service-ci.yml"
  pull_request:
    paths:
      - "agent-service/**"
      - "Dockerfile"
      - ".github/workflows/agent-service-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A push and its matching pull_request synchronization must not cancel each other.
  # Isolate events while retaining cancellation for superseded runs of the same event/ref.
  group: nanou-browser-agent-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Dedicated ARM64 runner in Debian PRoot; never use the separate LudoMada runner.
    runs-on: [self-hosted, Linux, ARM64, nanou-browser-agent]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated Python environment (Debian ARM64)
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/bin/python3
          /usr/bin/python3 --version
          /usr/bin/python3 -m venv "$RUNNER_TEMP/nanou-browser-venv"
          echo "$RUNNER_TEMP/nanou-browser-venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/nanou-browser-venv" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/nanou-browser-venv/bin/python" --version
      - name: Install service dependencies
        run: pip install -r agent-service/requirements.txt
      - name: Run safety and API tests
        env:
          PYTHONPATH: agent-service
        run: pytest -q agent-service/tests

name: Nanou Browser Android CI

on:
  push:
    branches: [main, android-alternative]
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"
      - "gradle.properties"
  pull_request:
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nanou-browser-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests and Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Run unit tests and build APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Validate APK archive
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -n 2
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NanouBrowser-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

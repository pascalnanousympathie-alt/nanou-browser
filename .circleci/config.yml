version: 2.1

jobs:
  agent-service-tests:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    working_directory: ~/project
    steps:
      - checkout
      - restore_cache:
          keys:
            - nanou-agent-pydeps-v2-{{ checksum "agent-service/requirements.txt" }}
            - nanou-agent-pydeps-v2-
      - run:
          name: Install Agent Service dependencies
          command: |
            python -m pip install --upgrade pip
            python -m pip install -r agent-service/requirements.txt
      - save_cache:
          key: nanou-agent-pydeps-v2-{{ checksum "agent-service/requirements.txt" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Check Python source syntax
          command: python -m compileall -q agent-service
      - run:
          name: Run browser-agent safety and API tests
          environment:
            PYTHONPATH: agent-service
          command: python -m pytest -q agent-service/tests
      - run:
          name: Verify web-service deployment inputs
          command: |
            test -s Dockerfile
            test -s render.yaml
            grep -q 'healthCheckPath: /healthz' render.yaml
            grep -q 'NANOU_AGENT_API_KEY' render.yaml

workflows:
  nanou-browser-web-agent-verification:
    jobs:
      - agent-service-tests
